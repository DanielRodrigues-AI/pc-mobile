<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17243f"><title>P.C.Mobile · Banco de questões</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="top"><div class="branding"><span class="symbol">PC</span><div><strong>P.C.Mobile</strong><small>Consulta de questões</small></div></div><button id="reload" class="lightbtn" title="Carregar a versão atual do banco">↻ Atualizar</button></header>
<main><section class="headline"><div><span class="eyebrow">BIBLIOTECA DE ESTUDOS</span><h1>Banco de questões</h1><p>Consulte matérias, módulos, provas, simulados e gabaritos.</p></div><div class="stats"><div><strong id="total">—</strong><span>Questões</span></div><div><strong id="subjects">—</strong><span>Matérias</span></div></div></section>
<section class="searchpanel"><label for="search">Buscar questão</label><input id="search" type="search" placeholder="Pesquisar no enunciado ou nas alternativas" autocomplete="off" disabled><div class="filters"><label>Matéria<select id="materia" disabled><option value="">Todas as matérias</option></select></label><label>Módulo<select id="modulo" disabled><option value="">Todos os módulos</option></select></label><label>Tipo<select id="tipo" disabled><option value="">Todos os tipos</option><option value="normal">Questões normais</option><option value="simulado">Simulados</option><option value="prova">Provas</option></select></label></div></section>
<section class="resultsbar"><h2>Questões encontradas</h2><span id="count">—</span></section><div id="status" class="status" role="status">Preparando a consulta...</div><div id="results" class="results"></div><div id="sentinel" aria-hidden="true"></div><div id="footer" class="footer">Banco somente para consulta. Conteúdo disponibilizado pelo responsável pelo repositório.</div></main>
<script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script><script src="app.js" defer></script></body></html>
